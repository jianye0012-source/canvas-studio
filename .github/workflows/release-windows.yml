name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix web
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix integrations/cozyclay
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix integrations/cozyclay/mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix launcher
          exit $LASTEXITCODE
      - name: Build portable package
        run: node launcher/scripts/package.mjs
      - name: Verify and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = node -p "require('./launcher/package.json').version"
          $releaseTag = "v$releaseVersion"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $releaseTag) { throw 'Tag does not match launcher version' }
          $releaseZip = "outputs/CanvasStudio-Windows-x64-$releaseVersion.zip"
          $expected = ((Get-Content -LiteralPath "$releaseZip.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $releaseZip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'ZIP hash mismatch' }
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { gh release create $releaseTag --target '${{ github.sha }}' --title "画布工作台 $releaseVersion" --notes 'Windows x64 便携整合包。完整解压到机械盘后运行启动器。真实模型服务和 Windows 实机功能请按使用说明验收。' }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload $releaseTag $releaseZip "$releaseZip.sha256" --clobber
          exit $LASTEXITCODE
