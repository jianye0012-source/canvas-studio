name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix web
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix integrations/cozyclay
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix integrations/cozyclay/mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix launcher
          exit $LASTEXITCODE
      - name: Verify owned process termination on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/tmp | Out-Null
          node --test launcher/test/process-control.test.cjs launcher/test/self-update.test.cjs launcher/test/model-3d-tasks.test.cjs launcher/test/runninghub-standard.test.cjs
          exit $LASTEXITCODE
      - name: Build portable package
        run: node launcher/scripts/package.mjs
      - name: Verify portable projects on isolated Windows workspaces
        run: node launcher/test/portable-browser-smoke.cjs
        env:
          TMPDIR: ${{ github.workspace }}/work/tmp
      - name: Verify director lifecycle and mocked 3D generation on Windows
        run: node launcher/test/director-lifecycle.cjs
        env:
          TMPDIR: ${{ github.workspace }}/work/tmp
      - name: Verify direct installation and official rollback on Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.3 --repo $env:GITHUB_REPOSITORY --pattern 'CanvasStudio-Windows-x64-1.3.3.zip*' --dir work/tmp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip = 'work/tmp/CanvasStudio-Windows-x64-1.3.3.zip'
          $expected = ((Get-Content -LiteralPath "$zip.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Historical ZIP hash mismatch' }
          node launcher/test/windows-install-smoke.cjs $zip
          exit $LASTEXITCODE
      - name: Verify and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = node -p "require('./launcher/package.json').version"
          $releaseTag = "v$releaseVersion"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $releaseTag) { throw 'Tag does not match launcher version' }
          $releaseZip = "outputs/CanvasStudio-Windows-x64-$releaseVersion.zip"
          $expected = ((Get-Content -LiteralPath "$releaseZip.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $releaseZip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'ZIP hash mismatch' }
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { gh release create $releaseTag --target '${{ github.sha }}' --title "画布工作台 $releaseVersion" --notes 'Windows x64 便携整合包。完整解压到机械盘后运行启动器。真实模型服务和 Windows 实机功能请按使用说明验收。' }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $upgradeZip = "outputs/CanvasStudio-Launcher-Upgrade-$releaseVersion.zip"
          gh release upload $releaseTag $releaseZip "$releaseZip.sha256" $upgradeZip "$upgradeZip.sha256" --clobber
          exit $LASTEXITCODE
