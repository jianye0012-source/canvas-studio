name: metrics-snapshot

on:
  schedule:
    # Daily at 09:05 KST. The traffic API keeps 14 days, so a missed run is
    # backfilled by the next one. The Aside report routine also dispatches this
    # workflow before it reads the ledger.
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the metrics ledger branch
        run: |
          git config user.name "metrics-snapshot"
          git config user.email "actions@github.com"
          if git fetch origin metrics 2>/dev/null; then
            git worktree add ../metrics origin/metrics -b metrics
          else
            git worktree add --detach ../metrics
            cd ../metrics
            git checkout --orphan metrics
            git rm -rf --quiet . || true
            echo "# CozyClay metrics ledger (appended by .github/workflows/metrics.yml)" > README.md
          fi
      - name: Append snapshots
        env:
          # The default Actions token cannot read the traffic API (403);
          # METRICS_TOKEN is a PAT with push/Administration-read access.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node tools/metrics-snapshot.mjs ../metrics/data
      - name: Commit and push
        run: |
          cd ../metrics
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "metrics: snapshot $(date -u +%F)"
            git push origin HEAD:metrics
          fi
